<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schema builder — Quemsi Agent</title>
  <link rel="stylesheet" href="/control/builder/static/builder.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1 id="title">Configure tables</h1>
      <p class="meta">Datasource: <strong id="datasource"></strong></p>
      <p id="allHint" class="meta hint" hidden></p>
    </header>

    <!-- ClearTables / DropTables -->
    <section id="tablesMode" hidden>
      <div class="toolbar">
        <label class="all-toggle">
          <input type="checkbox" id="clearAll" />
          <span id="allLabel">All tables</span>
        </label>
        <input type="search" id="filter" placeholder="Filter tables…" />
        <button type="button" id="clearSelection" class="btn secondary">Clear selection</button>
      </div>
      <p id="status" class="status">Loading tables…</p>
      <div id="list" class="list" hidden>
        <label class="row list-header">
          <input type="checkbox" id="selectAll" />
          <span>Select all</span>
        </label>
        <div id="listBody" class="list-body"></div>
      </div>
    </section>

    <!-- MaskColumns -->
    <section id="maskMode" hidden>
      <p id="maskStatus" class="status">Loading tables…</p>
      <div class="mask-layout">
        <div class="mask-pane">
          <input type="search" id="maskTableFilter" placeholder="Filter tables…" />
          <div id="maskTableList" class="list mask-table-list"></div>
        </div>
        <div class="mask-pane">
          <div class="mask-columns-header">
            <strong id="maskTableTitle">Select a table</strong>
            <label class="all-toggle" id="maskSelectAllWrap" hidden>
              <input type="checkbox" id="maskSelectAllCols" />
              <span>Select all columns</span>
            </label>
          </div>
          <input type="search" id="maskColumnFilter" placeholder="Filter columns…" disabled />
          <div id="maskColumnList" class="list mask-column-list"></div>
        </div>
      </div>
      <p id="maskSelectionSummary" class="status">0 columns selected</p>
      <button type="button" id="maskClearSelection" class="btn secondary">Clear selection</button>
    </section>

    <!-- UpdateSequences -->
    <section id="seqMode" hidden>
      <p id="seqStatus" class="status">Loading sequences…</p>
      <div class="seq-layout">
        <div class="mask-pane">
          <div class="mask-columns-header"><strong>Sequences</strong></div>
          <input type="search" id="seqFilter" placeholder="Filter sequences…" />
          <div id="seqList" class="list mask-table-list"></div>
        </div>
        <div class="mask-pane">
          <div class="mask-columns-header"><strong>Table</strong></div>
          <input type="search" id="seqTableFilter" placeholder="Filter tables…" />
          <div id="seqTableList" class="list mask-table-list"></div>
        </div>
        <div class="mask-pane">
          <div class="mask-columns-header">
            <strong id="seqColumnTitle">Column</strong>
          </div>
          <input type="search" id="seqColumnFilter" placeholder="Filter columns…" disabled />
          <div id="seqColumnList" class="list mask-column-list"></div>
        </div>
      </div>
      <p id="seqSelectionSummary" class="status">0 mappings</p>
      <button type="button" id="seqClearSelection" class="btn secondary">Clear mappings</button>
    </section>

    <!-- Subset -->
    <section id="subsetMode" hidden>
      <p id="subsetStatus" class="status">Loading tables…</p>
      <div class="subset-layout">
        <div class="mask-pane subset-tables-pane">
          <div class="mask-columns-header">
            <strong>Tables</strong>
            <button type="button" id="subsetAddAll" class="btn secondary" title="Add every table as an entire-table driver">Add all</button>
          </div>
          <input type="search" id="subsetTableFilter" placeholder="Filter tables…" />
          <div id="subsetTableList" class="list mask-table-list"></div>
        </div>
        <div class="mask-pane subset-work-pane">
          <div class="mask-columns-header">
            <strong id="subsetTableTitle">Select a table</strong>
          </div>
          <div id="subsetWorkbench" class="subset-workbench" hidden>
            <div class="subset-controls">
              <label class="all-toggle">
                <input type="checkbox" id="subsetEntireTable" />
                <span>Entire table</span>
              </label>
              <label class="subset-field subset-filter-field">
                <span>Filter</span>
                <input type="text" id="subsetWhere" placeholder="t.status = 'FAILED'" />
              </label>
              <label class="subset-field" id="subsetSeedLimitWrap">
                <span>Seed limit</span>
                <input type="number" id="subsetLimit" min="1" placeholder="optional" />
              </label>
              <button type="button" id="subsetBrowseApply" class="btn secondary">Apply filter</button>
              <button type="button" id="subsetAddDriver" class="btn primary">Add to subset</button>
            </div>
            <p id="subsetBrowseStatus" class="status"></p>
            <div class="subset-grid-wrap">
              <table id="subsetGrid" class="subset-grid">
                <thead id="subsetGridHead"></thead>
                <tbody id="subsetGridBody"></tbody>
              </table>
            </div>
            <div id="subsetPager" class="subset-pager" hidden>
              <button type="button" id="subsetPrevPage" class="btn secondary">Prev</button>
              <span id="subsetPageLabel" class="subset-page-label"></span>
              <button type="button" id="subsetNextPage" class="btn secondary">Next</button>
              <label class="subset-field">
                <span>Page size</span>
                <select id="subsetPageSize">
                  <option value="25">25</option>
                  <option value="50" selected>50</option>
                  <option value="100">100</option>
                </select>
              </label>
            </div>
          </div>
        </div>
        <div class="mask-pane subset-side-pane">
          <div class="mask-columns-header"><strong>Drivers</strong></div>
          <div id="subsetDriversList" class="list subset-drivers-list"></div>
          <div class="mask-columns-header mt"><strong>Impact preview</strong></div>
          <p id="subsetPreviewStatus" class="status">No drivers yet</p>
          <div id="subsetPreviewList" class="list subset-preview-list"></div>
        </div>
      </div>
    </section>

    <footer class="actions">
      <button type="button" id="cancel" class="btn secondary">Cancel</button>
      <button type="button" id="apply" class="btn primary">Apply</button>
    </footer>
  </main>

  <script>
    window.__BUILDER__ = {
      sessionId: "{{SESSION_ID}}",
      token: "{{BROWSER_TOKEN}}",
      mode: "{{MODE}}",
      datasource: "{{DATASOURCE}}",
      draft: JSON.parse('{{DRAFT_JSON}}')
    };
  </script>
  <script src="/control/builder/static/builder.js"></script>
</body>
</html>
